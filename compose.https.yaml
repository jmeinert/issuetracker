services:
  backend:
    environment:
      SERVER_SERVLET_SESSION_COOKIE_SECURE: true
  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-443}:8443"
    volumes: !override
      - ./frontend/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/nginx/common.conf:/etc/nginx/snippets/common.conf:ro
      - ./.certs:/etc/nginx/certs:ro
