spring:
  application:
    name: issuetracker

  jpa:
    open-in-view: false

  data:
    web:
      pageable:
        max-page-size: 100

springdoc:
  default-produces-media-type: application/json
  override-with-generic-response: false

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
