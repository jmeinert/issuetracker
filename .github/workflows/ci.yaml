name: CI

on:
  push:
    branches:
      - main
      - "v[0-9]+" # v1, v2, ...
  pull_request:

permissions:
  contents: read

jobs:
  backend-verify:
    name: Maven verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify
        working-directory: backend
        run: ./mvnw -B verify

  backend-build:
    name: Build backend Docker image
    needs: backend-verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        working-directory: backend
        run: docker build -t issuetracker-backend:ci .
